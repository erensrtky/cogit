# .start-project/qa.conf — QA aşama komutları (bkz. .start-project/qa)
#
# İKİ BÖLÜM:
#  1) Aşağıdaki QA_<AŞAMA>_CMD = SENİN override'ların. start-project ASLA dokunmaz.
#     Doldurursan alttaki otomatik tespiti EZER. Bir aşamayı KAPATMAK için "-" yaz.
#     Boş bırak = "otomatik tespiti kullan".
#  2) Marker bloğu (QA_DETECTED_*) = otomatik tespit. Scaffold'da ve
#     `start-project qa rescan` ile yenilenir — `--update` qa.conf'a DOKUNMAZ.
#
# Aşamalar: lint typecheck unit audit smoke e2e mobile_e2e
#   lint/typecheck/unit/smoke/e2e/mobile_e2e fail -> gate patlar (Ralph "bitti" diyemez)
#   audit fail -> sadece ⚠, gate patlamaz
#   smoke/e2e/mobile_e2e -> sadece `./qa --full`
#
# Ralph gate'i `--update` .ralph/.ralphrc'ye bağlar (block). Proje borçluysa
# (./qa kırmızı) Ralph tıkanır → o projenin .ralph/.ralphrc'sinde
# QUALITY_GATE_MODE=warn yap (ya da TEST_COMMAND/QUALITY_GATES satırlarını
# comment'le). start-project bunu bir daha EZMEZ.

QA_LINT_CMD=""
QA_TYPECHECK_CMD=""
QA_UNIT_CMD=""
QA_AUDIT_CMD=""
QA_SMOKE_CMD=""
# smoke (web) — sadece `./qa --full`. QA_SMOKE_BASE_URL boşsa aşama atlanır.
QA_SMOKE_BASE_URL=""       # örn: http://localhost:5173  (uygulama AYAKTA olmalı)
QA_SMOKE_URLS="/"          # boşluk ayrık path listesi; "/yol::beklenen metin" opsiyonel
QA_SMOKE_CHROME=""         # boş = otomatik bul (google-chrome / chromium-browser / …)
# e2e / agent-driven browser (.start-project/browse MCP) — `start-project --update --e2e`
QA_E2E_BASE_URL=""         # örn: http://localhost:5173 — 'navigate' göreli yol tabanı
QA_E2E_HEADFUL="0"         # 1 = görünür pencere (yalnızca ekran başında insan varsa)
QA_E2E_CHROME=""           # boş = otomatik bul (QA_SMOKE_CHROME'a da düşer)
QA_E2E_EXTRA_HEADERS=""    # JSON obje, örn: {"x-device-id":"dev-123"} — her isteğe eklenir
QA_E2E_STORAGE_STATE=""    # cookie+localStorage JSON dosya yolu; ilk navigate'ten önce yüklenir
QA_E2E_CMD=""

# mobil e2e (Maestro) — `start-project --update --mobile-e2e`. Flow'lar:
# .start-project/mobile-e2e/flows/*.yaml. Maestro CLI kurulu değilse:
# curl -Ls "https://get.maestro.mobile.dev" | bash
QA_MOBILE_E2E_CMD=""
# diffcov — unit `--coverage` ile koşulur, `git diff` değişen KAYNAK satırları
# kaplanmamışsa gate FAIL (Ralph story'yi kapatamaz). Sadece DEĞİŞEN satıra bakar;
# eski kapsamsız kod görünmez (baseline gerekmez). Coverage araç-zinciri yoksa
# ⚠ basar, bloklamaz — paket eklenince kendiliğinden aktifleşir.
QA_DIFFCOV="1"             # 0 = kapat
QA_DIFFCOV_MIN="100"       # değişen satırların en az %'si kaplı olmalı
QA_DIFFCOV_UNIT_CMD=""     # unit'i coverage ile koşan komut (boş = otomatik tespit)
QA_DIFFCOV_LCOV=""         # lcov/clover rapor yolu (boş = coverage/lcov.info … dener)
QA_DIFFCOV_DIFF_BASE=""    # git diff tabanı (boş = working+index+untracked vs HEAD + son commit)
QA_DIFFCOV_EXCLUDE=""      # boşluk/virgül ayrık glob — bu dosyalar gate dışı (yalancı pozitif kaçışı)

# >>> start-project: auto-detected (scaffold + qa rescan ile yenilenir) >>>
# profil: (tespit edilemedi — komutları yukarı override bloğuna elle yaz)
QA_DETECTED_LINT=""
QA_DETECTED_TYPECHECK=""
QA_DETECTED_UNIT=""
QA_DETECTED_AUDIT=""
QA_DETECTED_SMOKE=""
QA_DETECTED_E2E=""
QA_DETECTED_MOBILE_E2E=""
QA_DETECTED_DIFFCOV_UNIT=""
QA_DETECTED_DIFFCOV_LCOV=""
# <<< start-project: auto-detected <<<
