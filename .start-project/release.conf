# .start-project/release.conf — release katmanı ayarları (bkz. .start-project/release)
# Bir kez yazılır; `start-project --update` ASLA ezmez.

# commit-msg hook: Conventional Commits'e uymayan commit mesajını reddeder.
# Kabul edilen tipler: build chore ci docs feat fix perf refactor revert style test
# 0 = hook no-op (kurulu olsa bile). Tekil kaçış: git commit --no-verify
RELEASE_COMMIT_HOOK=1

# git tag öneki (vX.Y.Z). Boş bırakma.
RELEASE_TAG_PREFIX=v
