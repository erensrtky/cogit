# Weekly update PRs; the ci workflow tests each one on Linux, Windows and macOS.
# Minor and patch bumps come together in one PR, so the queue stays short.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The types follow the oldest Node cogit supports (engines: >=22.13).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # 12.x adds about 1.9 MB to the package for nothing the map draws yet.
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
